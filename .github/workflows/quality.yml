name: Calidad y depuración de medios
on:
  push:
    branches: [main, "design/**"]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run check
      - run: npm test
  media-source-investigation:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar metadatos públicos del reproductor
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://mixkit.co/free-stock-video/engagement-jewelry-5218/'
          with urllib.request.urlopen(url,timeout=15) as resp:
            s=resp.read().decode('utf8','replace')
          for pattern in ('mp4','video_url','video-src','videoSrc','videoPlayer','video-file','5218','assets.mixkit.co','source src','preview'):
            print('PATTERN',pattern,'COUNT',s.lower().count(pattern.lower()))
            for match in list(re.finditer(re.escape(pattern),s,re.I))[:3]:
              print(repr(s[max(0,match.start()-180):match.end()+230]))
          PY
