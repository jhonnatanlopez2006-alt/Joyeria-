name: Calidad y diagnóstico de medios
on:
  push:
    branches: [main, "fase-ii/**", "design/**"]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run check
      - run: npm test
  video-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar recursos oficiales desde sus páginas públicas
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,html
          urls=[
            'https://www.pexels.com/video/silver-jewelries-on-the-table-9430551/',
            'https://www.pexels.com/video/close-up-of-jewelry-5705007/',
            'https://pixabay.com/videos/jewelry-ring-bracelet-jewellery-219228/',
            'https://mixkit.co/free-stock-video/engagement-jewelry-5218/'
          ]
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; AcademicPreview/1.0)'})
              with urllib.request.urlopen(req,timeout=12) as res:
                data=res.read(2000000).decode('utf8','replace')
                matches=list(dict.fromkeys(re.findall(r'https?[^"\\\s<>]{1,270}?(?:\\.mp4|mp4\\?[^"\\\s<>]{1,90})',html.unescape(data),re.I)))
                print('PAGE',res.status,len(data),u)
                print('MATCHES',matches[:12])
            except Exception as e:print('FAIL',u,str(e)[:180])
          PY
