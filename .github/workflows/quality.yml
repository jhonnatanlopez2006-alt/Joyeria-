name: Calidad de código y recursos audiovisuales
on:
  push:
    branches: [main, "fase-ii/**", "design/**"]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Sintaxis
        run: npm run check
      - name: Reglas de negocio
        run: npm test
  media-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar videos e imagen de catálogo
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://videos.pexels.com/video-files/9430551/9430551-uhd_4096_2160_25fps.mp4"
            "https://videos.pexels.com/video-files/5705007/5705007-uhd_4096_2160_24fps.mp4"
            "https://videos.pexels.com/video-files/35764318/15163401_3840_2160_50fps.mp4"
            "https://images.pexels.com/photos/13771607/pexels-photo-13771607.jpeg"
          )
          for url in "${urls[@]}"; do
            echo "Verificando $url"
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 35 --silent --show-error --range 0-1023 --output /dev/null "$url"
          done
