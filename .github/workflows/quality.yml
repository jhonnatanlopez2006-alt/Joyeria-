name: Calidad y comprobación multimedia
on:
  push:
    branches: [main, "fase-ii/**", "design/**"]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run check
      - run: npm test
  media-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de recursos externos
        shell: bash
        run: |
          urls=(
            "https://assets.mixkit.co/videos/preview/mixkit-engagement-jewelry-5218-large.mp4"
            "https://assets.mixkit.co/videos/preview/mixkit-engagement-jewelry-5218-small.mp4"
            "https://videos.pexels.com/video-files/9430551/9430551-hd_1920_1080_25fps.mp4"
            "https://videos.pexels.com/video-files/9430551/9430551-hd_1280_720_25fps.mp4"
            "https://videos.pexels.com/video-files/5705007/5705007-hd_1920_1080_25fps.mp4"
            "https://videos.pexels.com/video-files/35764318/35764318-hd_1920_1080_50fps.mp4"
            "https://images.pexels.com/photos/13771607/pexels-photo-13771607.jpeg"
            "https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=700"
          )
          for url in "${urls[@]}"; do
            result=$(curl -L -r 0-1023 --max-time 15 -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$url")
            echo "$result $url"
          done
